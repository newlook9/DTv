name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Signing key found"
          else
            echo "No signing key found, using debug key"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease -PverCode=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LiveTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTV-APK
          path: LiveTV.apk

      - name: Publish release for in-app updates
        if: ${{ env.KEYSTORE_PATH != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LiveTV build ${{ github.run_number }}
          files: LiveTV.apk
